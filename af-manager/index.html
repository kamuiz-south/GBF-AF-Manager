<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GBF AF Manager</title>
  <style>
    :root {
      color-scheme: dark;
      --boot-bg: #0c0e12;
      --boot-icon-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --boot-bg: #f8fafc;
      --boot-icon-shadow: 0 18px 48px rgba(15, 23, 42, 0.16);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background-color: var(--boot-bg);
    }

    body {
      overflow: hidden;
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--boot-bg);
      opacity: 1;
      transition: opacity 160ms ease;
      pointer-events: none;
    }

    #boot-splash img {
      width: clamp(72px, 10vw, 112px);
      height: clamp(72px, 10vw, 112px);
      object-fit: contain;
      filter: drop-shadow(var(--boot-icon-shadow));
      animation: boot-icon-pulse 1.6s ease-in-out infinite;
    }

    #boot-splash.boot-splash--hidden {
      opacity: 0;
    }

    @keyframes boot-icon-pulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.92;
      }

      50% {
        transform: scale(1.035);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot-splash img {
        animation: none;
      }
    }
  </style>
  <script>
    // Keep this key in sync with THEME_CACHE_KEY in src/utils/applyDesign.ts.
    try {
      if (localStorage.getItem('af-manager-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
      }
    } catch (_) {
      // Ignore storage errors; the splash will use the default dark background.
    }
  </script>
</head>

<body>
  <div id="boot-splash" aria-hidden="true">
    <img src="/icon.png" alt="" draggable="false" />
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
